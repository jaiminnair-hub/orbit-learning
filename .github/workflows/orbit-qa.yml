name: Orbit QA Runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orbit-qa:
    name: Admin and Learner QA personas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start --ignore-health-check
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:personas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-qa-report-${{ github.run_id }}
          path: artifacts/qa/
          if-no-files-found: warn
          retention-days: 30
